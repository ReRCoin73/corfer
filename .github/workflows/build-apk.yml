name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'manifest.json'
      - 'index.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap (avoid interactive prompts)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias corfer \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=CorFer, OU=App, O=CorFer, L=BR, ST=BR, C=BR"

      - name: Create TWA manifest
        run: |
          cat > twa-manifest.json << 'EOF'
          {
            "packageId": "br.io.corfer.twa",
            "host": "rercoin73.github.io",
            "name": "CorFer",
            "launcherName": "CorFer",
            "display": "standalone",
            "themeColor": "#a06cf0",
            "navigationColor": "#a06cf0",
            "backgroundColor": "#fff6e9",
            "startUrl": "/corfer/index.html",
            "iconUrl": "https://rercoin73.github.io/corfer/icon-512.png",
            "maskableIconUrl": "https://rercoin73.github.io/corfer/icon-512-maskable.png",
            "webManifestUrl": "https://rercoin73.github.io/corfer/manifest.json",
            "fallbackType": "customtabs",
            "enableNotifications": false,
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "minSdkVersion": 21,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "corfer"
            }
          }
          EOF

      - name: Install expect
        run: sudo apt-get update -y -q && sudo apt-get install -y -q expect

      - name: Build APK (automated with expect)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          cat > build.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 900
          set password $env(KEYSTORE_PASSWORD)
          spawn bubblewrap build --skipPwaValidation
          expect {
            -re "install the Android SDK" { send "no\r"; exp_continue }
            -re "install the JDK" { send "no\r"; exp_continue }
            -re "regenerate.*project" { send "yes\r"; exp_continue }
            -re "Password for the Key Store" { send "$password\r"; exp_continue }
            -re "Password for the Key" { send "$password\r"; exp_continue }
            -re "\\(Y/n\\)" { send "yes\r"; exp_continue }
            -re "\\(y/N\\)" { send "no\r"; exp_continue }
            -re "Minifying" { exp_continue }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EOF
          chmod +x build.exp
          expect -f build.exp

      - name: List build output
        run: find . -maxdepth 3 \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: corfer-apk
          path: |
            *.apk
            *.aab
          if-no-files-found: warn
